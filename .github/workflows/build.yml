name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # NOTE: the full-stack `vcs import < ros2.repos && colcon build` is NOT a
  # per-PR gate here. It needs org auth (the manifest includes the private
  # wrapper) and the closed NOVATEK SDK, neither available to anonymous CI.
  # That integration build lives in an authenticated release/dispatch workflow
  # (the V2 manifest-reproducibility check), tracked separately. Per-PR CI on
  # this meta-repo validates the manifest and lints.

  lint:
    uses: NCKU-custos/custos-infra/.github/workflows/lint.yml@main
    with:
      run_clang_format: false
      run_ament_lint: false

  validate-ros2-repos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install vcstool
        run: pip install vcstool
      - name: Validate ros2.repos
        run: |
          # Advisory: remote ref resolution. Won't gate the job — the private
          # wrapper needs org auth (unavailable to anonymous CI) and version
          # tags may not exist until releases land. The pin check below is the
          # hard gate.
          vcs validate --input ros2.repos \
            || echo "::warning::vcs validate could not verify all refs (private wrapper needs org auth; version tags may predate releases)"
          # Pin discipline: every entry must have a `version:` set (tag or branch)
          if grep -E '^\s*url:' ros2.repos | wc -l | xargs test 0 -ne; then
            missing=$(python3 -c "
          import yaml, sys
          with open('ros2.repos') as f:
              data = yaml.safe_load(f)
          repos = data.get('repositories', {})
          missing = [name for name, r in repos.items() if not r.get('version')]
          if missing:
              print('\n'.join(missing))
              sys.exit(1)
          ")
            if [ -n "$missing" ]; then
              echo "::error::ros2.repos entries missing pinned version: $missing"
              exit 1
            fi
          fi
